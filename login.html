<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BodyPro | Secure Authentication</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  
  <style>
    /* Specific Login Layout Overrides */
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(circle at top center, var(--bg-surface-elevated) 0%, var(--bg-base) 100%);
      padding: 20px;
    }
    
    .login-container {
      width: 100%;
      max-width: 420px;
    }
    
    .brand-header {
      text-align: center;
      margin-bottom: 35px;
      animation: fadeInDown 0.8s ease-out;
    }
    
    .brand-header i {
      font-size: 3.5rem;
      color: var(--primary);
      margin-bottom: 15px;
      text-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
    }
    
    .brand-header h1 {
      font-size: 2.2rem;
      margin-bottom: 5px;
      letter-spacing: 1px;
    }
    
    .brand-header p {
      color: var(--text-muted);
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 600;
    }

    .auth-toggle {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .auth-toggle a {
      cursor: pointer;
    }

    #authMessage {
      text-align: center;
      margin-top: 15px;
      font-weight: 600;
      font-size: 0.9rem;
      min-height: 20px;
    }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 25px 0;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border-color);
    }

    .divider:not(:empty)::before { margin-right: 15px; }
    .divider:not(:empty)::after { margin-left: 15px; }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="brand-header">
      <i class="fa-solid fa-heart-pulse"></i>
      <h1>BodyPro</h1>
      <p>Telemetry & Nutrition</p>
    </div>

    <div class="card">
      <div class="form-group">
        <label for="authEmail">Email Address</label>
        <input type="email" id="authEmail" placeholder="Enter your email" autocomplete="email">
      </div>
      
      <div class="form-group">
        <label for="authPassword">Password</label>
        <input type="password" id="authPassword" placeholder="Enter your password" autocomplete="current-password">
      </div>

      <div id="actionButtons" style="display: flex; flex-direction: column; gap: 10px; margin-top: 20px;">
        <button id="btnLogin" class="btn">
          <i class="fa-solid fa-right-to-bracket"></i> Secure Log In
        </button>
        <button id="btnRegister" class="btn btn-accent hidden">
          <i class="fa-solid fa-user-plus"></i> Create Account
        </button>
      </div>

      <div class="auth-toggle">
        <a id="toggleModeBtn" class="text-primary">Need an account?</a>
        <a id="btnReset" class="text-muted">Forgot Password?</a>
      </div>

      <div class="divider">OR</div>

      <button id="btnGoogleLogin" class="btn btn-ghost">
        <i class="fa-brands fa-google"></i> Continue with Google
      </button>

      <div id="authMessage"></div>
    </div>
  </div>

  <script>
    // Simple UI Toggle for Login/Register (The actual Firebase logic will sit in login.js)
    const toggleModeBtn = document.getElementById('toggleModeBtn');
    const btnLogin = document.getElementById('btnLogin');
    const btnRegister = document.getElementById('btnRegister');
    let isLoginMode = true;

    toggleModeBtn.addEventListener('click', () => {
      isLoginMode = !isLoginMode;
      if (isLoginMode) {
        btnLogin.classList.remove('hidden');
        btnRegister.classList.add('hidden');
        toggleModeBtn.textContent = 'Need an account?';
      } else {
        btnLogin.classList.add('hidden');
        btnRegister.classList.remove('hidden');
        toggleModeBtn.textContent = 'Back to login';
      }
      document.getElementById('authMessage').innerText = ''; // Clear errors on toggle
    });
  </script>

  <script type="module" src="data-store.js"></script>
  <script type="module" src="login.js"></script>
  
</body>
</html>
